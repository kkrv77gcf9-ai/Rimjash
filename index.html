<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Date</title>

<style>
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle,#ffe6f0,#fff);
text-align:center;
overflow-x:hidden;
}

/* floating hearts */
.heart{
position:absolute;
color:pink;
animation:float 6s infinite;
font-size:18px;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

.container{margin-top:60px;}

button{
padding:15px 25px;
margin:20px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
}

#yes{background:#ff4d88;color:white;}
#no{background:#ccc;position:relative;}

.hidden{display:none;}

img{
width:180px;
margin:10px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.big{
width:220px;
}
</style>
</head>

<body>

<!-- MUSIC -->
<iframe width="0" height="0"
src="https://www.youtube.com/embed/ZmDBbnmKpqQ?autoplay=1&loop=1"
allow="autoplay"></iframe>

<!-- PAGE 1 -->
<div id="page1" class="container">

<h2>Will you go on a date with me? 💖</h2>

<!-- 3D style images -->
<img class="big" src="https://i.imgur.com/6y0z8YH.png" alt="strawberry bouquet">
<img class="big" src="https://i.imgur.com/9Qx3XQm.png" alt="pancake">

<br>

<button id="yes" onclick="goYes()">Yes ❤️</button>
<button id="no" onclick="runAway()">No 🤍</button>

</div>

<!-- PAGE 2 -->
<div id="page2" class="container hidden">
<h2>Wait you actually said yess ?? 😳💖</h2>
<button onclick="goPlan()">Okey okey</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="container hidden">

<h2>Choose your plan 💕</h2>

<h3>Plan A</h3>
<p>Serious halal future + dinner in Algiers</p>

<h3>Plan B</h3>
<p>Casual date in Médéa - Baraka restaurant</p>

<button onclick="finalPage('Plan A')">Plan A</button>
<button onclick="finalPage('Plan B')">Plan B</button>

</div>

<!-- FINAL PAGE -->
<div id="final" class="container hidden">
<h1>🎉 فرحة</h1>
<h2 id="result"></h2>

<p>📸 قمي بعمل screenshot لهذا الخيار وأرسليه لي على Instagram</p>
</div>

<script>

// hearts
for(let i=0;i<12;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💗";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(h);
}

// NO button escape
function runAway(){
let btn=document.getElementById("no");
btn.style.position="absolute";
btn.style.left=Math.random()*80+"vw";
btn.style.top=Math.random()*80+"vh";
}

// YES
function goYes(){
document.getElementById("page1").classList.add("hidden");
document.getElementById("page2").classList.remove("hidden");
}

// PAGE 2 → PAGE 3
function goPlan(){
document.getElementById("page2").classList.add("hidden");
document.getElementById("page3").classList.remove("hidden");
}

// FINAL
function finalPage(plan){
document.getElementById("page3").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");
document.getElementById("result").innerHTML = "الخيار الذي اخترته: " + plan;
}

</script>

</body>
</html>
